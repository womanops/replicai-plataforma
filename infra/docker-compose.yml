# Sobe a plataforma inteira com um comando:  docker compose up
#
#   api     → recebe upload, cria o job, devolve o resultado
#   worker  → processa as peças (Chromium + motor). É o que escala.
#   redis   → fila entre a api e o worker
#
# A chave do modelo vem do ambiente. Antes de subir:
#   export ANTHROPIC_API_KEY=...        (ou um .env ao lado deste arquivo)

services:
  # `docker compose up` sobe tudo: a api responde em :8000/docs
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /dados
      # sem repasse, o contêiner não enxerga a chave e cai para a regra
      # determinística sem dizer nada. /saude denuncia: "compositor": "regra"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - dados:/dados
      - ../fontes:/app/fontes:ro
    depends_on:
      - redis

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    # as duas filas: a de peça primeiro, que é o que a pessoa espera ver.
    # O vídeo precisa de Node e Remotion, que esta imagem ainda não tem — por
    # enquanto o trabalho de vídeo falha dizendo isso, em vez de ficar parado
    # na fila para sempre.
    command: rq worker --url redis://redis:6379/0 replicai replicai-video
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /dados
      # sem repasse, o contêiner não enxerga a chave e cai para a regra
      # determinística sem dizer nada. /saude denuncia: "compositor": "regra"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - dados:/dados
      - ../fontes:/app/fontes:ro
    depends_on:
      - redis
    # Renderizar peça é pesado: suba mais réplicas conforme a demanda.
    deploy:
      replicas: 2

  redis:
    image: redis:8-alpine
    volumes:
      - redis:/data

volumes:
  dados:
  redis:
