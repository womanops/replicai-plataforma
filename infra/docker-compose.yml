# Sobe a plataforma inteira com um comando:  docker compose up
#
#   api     → a tela, o upload, o estado do trabalho e a entrega
#   worker  → processa as peças e os vídeos (Chromium + Node + motor)
#   redis   → fila entre a api e o worker
#
# As credenciais vêm do `.env` da raiz do projeto — o mesmo que a plataforma
# usa fora do contêiner. Não há cópia a manter em dois lugares, e a chave não
# passa pela linha de comando de ninguém:
#   ANTHROPIC_API_KEY=...     sem ela a composição cai para a régua
#   REPLICAI_SEGREDO=...      assina a sessão; sem ele, reiniciar desloga todo
#                             mundo e duas réplicas da api não se reconhecem.
#                             `/saude` diz quando falta.
#
# E uma vez só, para o fundo generativo:
#   docker compose run --rm worker higgsfield auth login

services:
  # A porta pública e o certificado. Sem ele a senha de quem entra atravessa a
  # internet legível e o navegador marca o site como não seguro. O Caddy pede
  # e renova o certificado na Let's Encrypt sozinho, de graça.
  porta:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-dados:/data
      - caddy-config:/config
    depends_on:
      - api

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    # sem `ports`: quem atende a internet é a `porta`, com certificado. Expor
    # a api direto deixaria uma entrada em HTTP puro aberta ao lado da segura
    expose:
      - "8000"
    # o mesmo arquivo que a plataforma lê fora do contêiner: chave do modelo,
    # segredo da sessão e, quando houver, as do Asaas. Sem ele o contêiner
    # sobe compondo pela régua e deslogando todo mundo a cada reinício
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /dados
    volumes:
      - dados:/dados
      - ../fontes:/app/fontes:ro
    depends_on:
      - redis

  # Dois tipos de worker, de propósito. Um worker só atendendo as duas filas
  # faz um vídeo de dois minutos travar todas as peças atrás dele — e peça é o
  # que a pessoa está olhando a tela esperando. Separados, a peça de um nunca
  # espera o vídeo de outro.
  #
  # Para aumentar a capacidade: suba `replicas` AQUI, nos workers — nunca na
  # api. A tranca que segura quem fica tentando senha conta na memória do
  # processo, e duas apis contariam cada uma por si: oito tentativas virariam
  # dezesseis. Peça custa 0,7 GB por worker e vídeo custa 2 GB, mais 0,4 a
  # 1,3 GB enquanto um PSD está sendo aberto — é por isso que não são o mesmo
  # número.
  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    # pelo `worker.py`, e não por `rq worker` direto: é ele que escolhe a
    # classe de worker por sistema. O nome da fila vem como argumento.
    command: python worker.py replicai
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /dados
    volumes:
      - dados:/dados
      - ../fontes:/app/fontes:ro
      # o login do Higgsfield é feito uma vez e vive no HOME do contêiner;
      # sem volume, cada subida pede login de novo e o fundo cai para bloco
      - higgsfield:/root/.config
    depends_on:
      - redis
    deploy:
      # Quantos workers de peça. Numa máquina de 8 GB é **1**: dois abrindo PSD
      # ao mesmo tempo chegam a 7,3 GB e o sistema começa a usar swap, que é
      # quando a peça demora mais do que se ela tivesse esperado na fila. Com
      # 16 GB, 2 é o número — e é o padrão.
      replicas: ${REPLICAI_WORKERS:-2}

  worker-video:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: python worker.py replicai-video
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /dados
    volumes:
      - dados:/dados
      - ../fontes:/app/fontes:ro
      - higgsfield:/root/.config
    depends_on:
      - redis
    # um por vez: o render já usa o navegador inteiro, e dois ao mesmo tempo
    # na mesma máquina disputam CPU sem entregar mais rápido
    deploy:
      replicas: 1

  # Apaga o material bruto de trabalhos com mais de 30 dias, uma vez por dia.
  # Sem ela nenhum disco serve: pelos volumes dos planos, quarenta clientes
  # geram 94 GB por mês e o PSD é 85% disso. Com ela, o acúmulo permanente
  # cai para 8 GB por mês.
  #
  # Serviço à parte, e não uma linha no worker: assim o registro dela é dela,
  # e dá para parar a faxina sem parar a produção.
  faxina:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: sh -c 'while true; do python -m api.faxina; sleep 86400; done'
    env_file:
      - ../.env
    environment:
      STORAGE_DIR: /dados
      REPLICAI_FAXINA_DIAS: ${REPLICAI_FAXINA_DIAS:-30}
    volumes:
      - dados:/dados

  # A cópia diária do que é dos clientes, mandada para FORA do servidor. O
  # backup do provedor é semanal e salva a máquina; isto salva o trabalho
  # entregue, que é o que o cliente pagou e não tem como ser refeito.
  #
  # Serviço à parte da faxina de propósito: a faxina apaga e esta guarda. Uma
  # parada não pode parar a outra — e a hora de descobrir que a cópia não
  # acontece não pode ser a hora de precisar dela.
  copia:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: sh -c 'while true; do python -m api.copia; sleep 86400; done'
    env_file:
      - ../.env
    environment:
      STORAGE_DIR: /dados
    volumes:
      - dados:/dados

  redis:
    image: redis:8-alpine
    volumes:
      - redis:/data

volumes:
  dados:
  redis:
  higgsfield:
  caddy-dados:
  caddy-config:
