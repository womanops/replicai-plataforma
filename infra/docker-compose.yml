# Sobe a plataforma inteira com um comando:  docker compose up
#
#   api     → a tela, o upload, o estado do trabalho e a entrega
#   worker  → processa as peças e os vídeos (Chromium + Node + motor)
#   redis   → fila entre a api e o worker
#
# As credenciais vêm do `.env` da raiz do projeto — o mesmo que a plataforma
# usa fora do contêiner. Não há cópia a manter em dois lugares, e a chave não
# passa pela linha de comando de ninguém:
#   ANTHROPIC_API_KEY=...     sem ela a composição cai para a régua
#   REPLICAI_SEGREDO=...      assina a sessão; sem ele, reiniciar desloga todo
#                             mundo e duas réplicas da api não se reconhecem.
#                             `/saude` diz quando falta.
#
# E uma vez só, para o fundo generativo:
#   docker compose run --rm worker higgsfield auth login

services:
  # `docker compose up` sobe tudo: a tela responde em :8000
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8000:8000"
    # o mesmo arquivo que a plataforma lê fora do contêiner: chave do modelo,
    # segredo da sessão e, quando houver, as do Asaas. Sem ele o contêiner
    # sobe compondo pela régua e deslogando todo mundo a cada reinício
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /dados
    volumes:
      - dados:/dados
      - ../fontes:/app/fontes:ro
    depends_on:
      - redis

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    # pelo `worker.py`, e não por `rq worker` direto: é ele que escolhe a
    # classe de worker por sistema e nomeia as duas filas num lugar só. Dois
    # jeitos de subir o mesmo worker é um jeito a mais de eles divergirem.
    command: python worker.py
    env_file:
      - ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /dados
    volumes:
      - dados:/dados
      - ../fontes:/app/fontes:ro
      # o login do Higgsfield é feito uma vez e vive no HOME do contêiner;
      # sem volume, cada subida pede login de novo e o fundo cai para bloco
      - higgsfield:/root/.config
    depends_on:
      - redis
    # Renderizar peça é pesado: suba mais réplicas conforme a demanda.
    deploy:
      replicas: 2

  # Apaga o material bruto de trabalhos com mais de 30 dias, uma vez por dia.
  # Sem ela nenhum disco serve: pelos volumes dos planos, quarenta clientes
  # geram 94 GB por mês e o PSD é 85% disso. Com ela, o acúmulo permanente
  # cai para 8 GB por mês.
  #
  # Serviço à parte, e não uma linha no worker: assim o registro dela é dela,
  # e dá para parar a faxina sem parar a produção.
  faxina:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: sh -c 'while true; do python -m api.faxina; sleep 86400; done'
    env_file:
      - ../.env
    environment:
      STORAGE_DIR: /dados
      REPLICAI_FAXINA_DIAS: ${REPLICAI_FAXINA_DIAS:-30}
    volumes:
      - dados:/dados

  redis:
    image: redis:8-alpine
    volumes:
      - redis:/data

volumes:
  dados:
  redis:
  higgsfield:
