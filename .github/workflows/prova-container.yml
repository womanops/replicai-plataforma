# A prova que decide a arquitetura: o motor renderiza uma peça dentro de um
# contêiner Linux? Se sim, roda em qualquer servidor, e a Fase 1 vale a pena.
#
# Roda aqui, e não na máquina de desenvolvimento, porque aquele MacBook é de
# 2017 e nenhum runtime de contêiner atual suporta o macOS dele. Aqui a prova
# acontece onde o produto vai de fato rodar: Linux.

name: prova do contêiner

on:
  push:
  pull_request:
  workflow_dispatch:        # permite rodar na mão pelo site do GitHub

jobs:
  testes:
    # Roda antes e mais rápido que a prova do contêiner: pega regressão de
    # lógica em segundos, sem precisar construir imagem.
    runs-on: ubuntu-latest
    # O Redis de mentira prova a lógica da fila; este prova que o trabalho
    # atravessa o processo — que é a razão de existir da fila. Na máquina de
    # desenvolvimento esses testes são pulados.
    services:
      redis:
        image: redis:7-alpine@sha256:6aafb7f25fc93c4ff74e99cff8e85899f03901bc96e61ba12cd3c39e95503c73
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: instalar o Chromium, que o render usa
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends chromium-browser || sudo apt-get install -y --no-install-recommends chromium
      - name: instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: rodar os testes
        # -m '' desliga o filtro padrão: na esteira os lentos também rodam,
        # com Chromium instalado no passo acima
        run: pytest -m '' --cov=motor --cov=api --cov-report=term-missing

  renderizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Separado do build de propósito: quando o registro recusa — cota de
      # quem puxa sem conta, imagem tirada do ar —, a falha some dentro de
      # "construir a imagem" e parece defeito nosso. Levou meia hora para
      # entender que onze segundos não dão nem para chegar ao apt.
      - name: puxar a imagem base
        run: |
          base=$(awk '/^FROM /{print $2; exit}' infra/Dockerfile)
          echo "imagem base: $base"
          docker pull "$base"

      - name: construir a imagem
        run: |
          set -o pipefail
          docker build -f infra/Dockerfile -t replicai:prova . 2>&1 | tee /tmp/build.log

      # O log do build só se lê entrando na conta do GitHub. Quem olha de fora
      # — ou de outra máquina, ou pelo celular — vê "exit code 1" e mais nada,
      # e aí o conserto vira adivinhação: aconteceu, e custou dois palpites
      # errados. O fim do log vira anotação, que aparece na página do run e
      # sai na API pública.
      - name: por que a imagem não construiu
        if: failure()
        run: |
          # duas anotações: o fim do log, e — quando a trava do Chromium é que
          # parou — a listagem do apt, que é o número que conserta. Ela some
          # no fim do log porque o BuildKit repete o comando inteiro depois
          echo "::error title=o build parou aqui::$(tail -c 1500 /tmp/build.log | tr '\n' '↵' | sed 's/::/:/g')"
          apt_diz=$(sed -n '/o que o apt tem/,/exit 1/p' /tmp/build.log | tr '\n' '↵' | sed 's/::/:/g')
          if [ -n "$apt_diz" ]; then
            echo "::error title=o apt desta imagem tem::${apt_diz}"
          fi

      - name: a imagem leva a plataforma inteira
        # Sem montar nada: é o conteúdo da própria imagem que está em prova.
        # O passo seguinte monta o repositório em /app e esconde tudo isso —
        # por isso esta conferência vem antes, e não depois.
        run: |
          docker run --rm replicai:prova sh -c '
            set -e
            test -f /app/web/index.html        || { echo "falta a tela";      exit 1; }
            test -f /app/worker.py             || { echo "falta o worker";    exit 1; }
            test -d /app/video/node_modules    || { echo "falta o Remotion";  exit 1; }
            command -v higgsfield >/dev/null   || { echo "falta a CLI do fundo"; exit 1; }
            command -v node >/dev/null         || { echo "falta o Node";      exit 1; }
            echo "tudo no lugar"'

      - name: a api sobe e enxerga o que precisa
        # `anthropic` é importado dentro das funções: faltando, nada quebra e a
        # plataforma inteira passa a compor pela régua, em silêncio. Foi assim
        # que ele ficou de fora de requirements por meses.
        run: |
          docker run --rm replicai:prova python -c '
          import anthropic, httpx, fastapi, rq
          from api import main, tarefas, animacao
          from api.contas import segredo_configurado
          print("api ok; anthropic", anthropic.__version__)'

      - name: renderizar uma peça dentro do contêiner
        # O repositório entra montado em /app para o contêiner enxergar testes/
        # e para a peça gerada sobrar aqui fora, onde o passo seguinte a guarda.
        run: |
          docker run --rm -v "$PWD:/app" -w /app replicai:prova \
            python testes/prova_container.py

      - name: guardar a peça gerada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: peca-de-prova
          path: testes/saida/
          if-no-files-found: warn
